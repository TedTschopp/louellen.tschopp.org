<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Louellen's website. Coming soon.">
    <meta name="theme-color" content="#ff4f00">
    <title>Louellen · Coming soon</title>
    <link rel="canonical" href="https://louellen.tschopp.org/">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <style>
      :root { color-scheme: light; --paper: #f7f5ef; --ink: #26352f; --muted: #57635d; --line: #d8dcd3; --accent: #ff4f00; --accent-text: #b03600; }
      * { box-sizing: border-box; }
      html { min-height: 100%; }
      body { margin: 0; min-height: 100vh; min-height: 100svh; background: var(--paper); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .page { width: min(100% - 64px, 1120px); min-height: 100vh; min-height: 100svh; margin-inline: auto; display: flex; flex-direction: column; }
      header, footer { display: flex; align-items: center; justify-content: space-between; gap: 24px; }
      header { padding-block: 30px; border-bottom: 1px solid var(--line); }
      .family { font-size: 14px; letter-spacing: .035em; }
      .mark { width: 32px; height: 32px; color: var(--accent); }
      main { flex: 1; display: flex; flex-direction: column; justify-content: center; padding-block: 84px 110px; }
      .status { display: flex; align-items: center; gap: 11px; margin: 0 0 32px; color: var(--accent-text); font-size: 12px; font-weight: 650; letter-spacing: .16em; text-transform: uppercase; }
      .status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
      h1 { margin: 0 0 28px -5px; color: var(--accent); font-family: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif; font-size: clamp(72px, 12vw, 150px); font-weight: 400; line-height: 1.02; letter-spacing: -.065em; }
      .message { margin: 0; max-width: 32ch; color: var(--muted); font-size: clamp(17px, 2vw, 21px); line-height: 1.65; }
      footer { padding-block: 24px 30px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; letter-spacing: .025em; }
      .footer-mark { display: inline-block; width: 28px; height: 1px; background: var(--accent); }
      @media (max-width: 600px) {
        .page { width: calc(100% - 40px); }
        header { padding-block: 23px; }
        main { padding-block: 80px 100px; }
        .status { margin-bottom: 28px; font-size: 11px; }
        h1 { font-size: clamp(62px, 16vw, 96px); margin-left: -2px; margin-bottom: 24px; }
        footer { padding-bottom: 24px; }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header>
        <span class="family">tschopp.org</span>
        <svg class="mark" viewBox="0 0 32 32" fill="none" aria-hidden="true">
          <circle cx="16" cy="16" r="7" stroke="currentColor" stroke-width="1.25"/>
          <path d="M16 1v5m0 20v5M1 16h5m20 0h5M5.4 5.4 9 9m14 14 3.6 3.6M5.4 26.6 9 23M23 9l3.6-3.6" stroke="currentColor" stroke-width="1.25"/>
        </svg>
      </header>
      <main>
        <p class="status">Coming soon</p>
        <h1>Louellen</h1>
        <p class="message">A new website is on the way.</p>
      </main>
      <footer>
        <span>louellen.tschopp.org</span>
        <span class="footer-mark" aria-hidden="true"></span>
      </footer>
    </div>
  </body>
</html>
